[project]
name = "graph-rag-demo"
version = "0.1.0"
description = "Throwaway proof of concept: graph RAG over deeply nested, self-similar German document corpora"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.26",
    "typer>=0.15",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "mistralai>=3.7",
    "httpx>=0.28",
    "reportlab>=5.1.0",
    "pypdf>=7.0.1",
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
graph-rag = "graph_rag.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The smoke test needs Neo4j, the parsing service and a Mistral key, and takes minutes
# rather than milliseconds. `just test` is the fast, pure-logic suite; `just smoke` is
# the one that runs against live infrastructure. Deselected here rather than left to
# the runner, so a bare `pytest` on a machine with nothing running still passes.
addopts = "-m 'not smoke'"
markers = [
    "smoke: end-to-end, against real Neo4j, Mistral and parsing service (see RUNBOOK.md)",
]
